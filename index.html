/* ═══ Constants ═══ */

const PROJECTS=["AB菌","水污染","Crack","Pattern","打工"];
const TTD=["today","this week","this month"];

const LVL_ORD={"very high":0,high:1,medium:2,low:3,"very low":4};
const LVL_VAL={"very high":2,high:1,medium:0,low:-1,"very low":-2};
const TTD_ORD={"today":0,"this week":1,"this month":2,"":3};

const LVL_CLR={"very high":"#d94f3d",high:"#e8854a",medium:"#c49a2a",low:"#4f9460","very low":"#7a8fa0"};
const LVL_BG={"very high":"#fef2f0",high:"#fef6f0",medium:"#fefaf0",low:"#f0faf2","very low":"#f2f5f7"};

/* ═══ Storage ═══ */

/* ═══ Date helpers: local-time safe ═══ */
const pad2=n=>String(n).padStart(2,"0");
const toLocalDateObj=d=>new Date(String(d).replace(" ","T"));
const parseLocalDateKey=k=>{
  const [y,m,dd]=k.split("-").map(Number);
  return new Date(y,m-1,dd);
};
const nowLocalISO=()=>{
  const d=new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
};
const localDateKey=d=>{
  const dt=toLocalDateObj(d);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;
};
const localMonthKey=d=>{
  const dt=toLocalDateObj(d);
  return `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}`;
};
const fmtDate=d=>{
  if(!d)return"";
  const dt=toLocalDateObj(d);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
};
const fmtHour=v=>{
  if(v===null||v===undefined||v==="")return"";
  const n=parseFloat(v);
  return Number.isFinite(n)?n.toFixed(1):"";
};
const getWeekKey=d=>{
  const dt=toLocalDateObj(d);
  const day=dt.getDay();
  const m=new Date(dt);
  m.setDate(dt.getDate()-((day+6)%7));
  return`${m.getFullYear()}-${pad2(m.getMonth()+1)}-${pad2(m.getDate())}`;
};
const getMonthKey=d=>localMonthKey(d);

/* ═══ Period helpers ═══ */
const todayKey=()=>{const d=new Date();return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const thisWeekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;};
const thisMonthKey=()=>{const d=new Date();return`${d.getFullYear()}-${pad2(d.getMonth()+1)}`;};
const isInPeriod=(cd,period)=>{
  if(!cd)return false;
  if(period==="today")return localDateKey(cd)===todayKey();
  if(period==="this week")return getWeekKey(cd)===thisWeekStart();
  if(period==="this month")return localMonthKey(cd)===thisMonthKey();
  return false;
};

/* ═══ Helpers ═══ */
const mkRef=(tid,sid)=>sid?`${tid}::${sid}`:tid;
const parseRef=ref=>{const p=ref.split("::");return{taskId:p[0],subtaskId:p[1]||null}};

const maxTtd=subs=>{
  if(!subs||!subs.length)return"";
  let mx=-1;
  subs.forEach(s=>{
    const v=TTD_ORD[s.timeToDo||""]??3;
    if(v>mx)mx=v;
  });
  return mx===3?"":TTD[mx];
};
const sumReqTime=subs=>{
  if(!subs||!subs.length)return"";
  let sum=0,any=false;
  subs.forEach(s=>{
    if(s.requiredTime!==""&&s.requiredTime!==null&&s.requiredTime!==undefined){
      const n=parseFloat(s.requiredTime);
      if(Number.isFinite(n)){sum+=n;any=true;}
    }
  });
  return any?String(Math.round(sum*100)/100):"";
};
const sumRequiredTime=items=>{
  let sum=0;
  items.forEach(it=>{
    const n=parseFloat(it.requiredTime);
    if(Number.isFinite(n))sum+=n;
  });
  return (Math.round(sum*10)/10).toFixed(1);
};
const taskIsComplete=task=>{
  if(task.subtasks&&task.subtasks.length>0)return task.subtasks.every(s=>!!s.completedDate);
  return !!task.completedDate;
};
const taskCompletedDate=task=>{
  if(task.subtasks&&task.subtasks.length>0){
    if(!task.subtasks.every(s=>s.completedDate))return null;
    return task.subtasks.reduce((mx,s)=>(!mx||new Date(s.completedDate)>new Date(mx))?s.completedDate:mx,null);
  }
  return task.completedDate;
};
const effective=task=>{
  if(task.subtasks&&task.subtasks.length>0){
    return{
      ...task,
      requiredTime:sumReqTime(task.subtasks),
      timeToDo:maxTtd(task.subtasks),
      completedDate:taskCompletedDate(task)
    };
  }
  return task;
};

const buildTodoItems=tasks=>{
  const items=[];
  tasks.forEach(t=>{
    if(t.subtasks&&t.subtasks.length>0){
      t.subtasks.forEach(s=>{
        items.push({
          ref:mkRef(t.id,s.id),
          taskId:t.id,
          subtaskId:s.id,
          displayName:`${t.name}  |  ${s.name}`,
          name:s.name,
          taskName:t.name,
          importance:t.importance,
          urgency:t.urgency,
          deadline:t.deadline,
          project:t.project,
          requiredTime:s.requiredTime,
          timeToDo:s.timeToDo||"",
          completedDate:s.completedDate
        });
      });
    }else{
      items.push({
        ref:t.id,
        taskId:t.id,
        subtaskId:null,
        displayName:t.name,
        name:t.name,
        taskName:null,
        importance:t.importance,
        urgency:t.urgency,
        deadline:t.deadline,
        project:t.project,
        requiredTime:t.requiredTime,
        timeToDo:t.timeToDo||"",
        completedDate:t.completedDate
      });
    }
  });
  return items;
};

function sortTasks(tasks,by){
  return[...tasks].sort((a,b)=>{
    const ae=effective(a),be=effective(b);
    if(by==="importance")return LVL_ORD[ae.importance]-LVL_ORD[be.importance];
    if(by==="urgency")return LVL_ORD[ae.urgency]-LVL_ORD[be.urgency];
    if(by==="deadline"){
      if(!ae.deadline&&!be.deadline)return 0;
      if(!ae.deadline)return 1;
      if(!be.deadline)return -1;
      return new Date(ae.deadline)-new Date(be.deadline);
    }
    if(by==="project")return(ae.project||"zzz").localeCompare(be.project||"zzz");
    return 0;
  });
}

function groupCompleted(tasks,by){
  const g={};
  tasks.forEach(t=>{
    const cd=taskCompletedDate(t);
    if(!cd)return;
    const key=by==="week"?getWeekKey(cd):getMonthKey(cd);
    if(!g[key])g[key]=[];
    g[key].push(t);
  });
  return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]));
}
function fmtGroupLabel(key,by){
  if(by==="week"){
    const d=parseLocalDateKey(key);
    const e=new Date(d);
    e.setDate(d.getDate()+6);
    return`${d.getMonth()+1}/${d.getDate()} – ${e.getMonth()+1}/${e.getDate()}, ${d.getFullYear()}`;
  }
  const[y,m]=key.split("-");
  const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return`${M[parseInt(m)-1]} ${y}`;
}

/* ═══ Shared Styles ═══ */
const iSt={width:"100%",padding:"9px 11px",border:"1px solid #D1D9E6",borderRadius:8,fontSize:14,color:"#1E293B",background:"#FFFFFF"};

const btnP={background:"#0070C0",color:"#fff",border:"none",borderRadius:10,padding:"10px 22px",fontSize:14,fontWeight:700,cursor:"pointer"};

/* ═══ Icons / Atoms ═══ */
function SvgIcon({type,color="#64748B",size=12}){
  if(type==="importance"){
    return(
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 4v10" stroke={color} strokeWidth="4" strokeLinecap="round"/>
        <circle cx="12" cy="19" r="2.25" fill={color}/>
      </svg>
    );
  }
  if(type==="urgency"){
    return(
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M13.5 2.5L4.5 14h7L10 21.5 20 9h-7l.5-6.5z" fill={color}/>
      </svg>
    );
  }
  if(type==="deadline"){
    return(
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3" y="5" width="18" height="16" rx="2" stroke={color} strokeWidth="2"/>
        <path d="M3 10h18" stroke={color} strokeWidth="2"/>
        <path d="M8 3v4M16 3v4" stroke={color} strokeWidth="2" strokeLinecap="round"/>
      </svg>
    );
  }
  if(type==="export"){
    return(
      <svg width={size} height={size} viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M6 2L2 6h3v9h2V6h3L6 2z" fill={color}/>
        <path d="M14 18l4-4h-3V5h-2v9h-3l4 4z" fill={color}/>
      </svg>
    );
  }
  return(
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" stroke={color} strokeWidth="2.4"/>
      <path d="M12 7v5l3.5 2" stroke={color} strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

function Badge({level,type}){
  const color=LVL_CLR[level]||"#64748B";
  return(
    <span style={{
      display:"inline-flex",
      alignItems:"center",
      justifyContent:"left",
      gap:4,
      fontSize:11,
      fontWeight:600,
      padding:"2px 8px",
      borderRadius:99,
      background:LVL_BG[level]||"#f2f2f2",
      color,
      width:82,
      flexShrink:0,
      whiteSpace:"nowrap"
    }}>
      <SvgIcon type={type==="i"?"importance":"urgency"} color={color} size={11}/>
      {level}
    </span>
  );
}

function TimeLabel({value,color="#64748B"}){
  const v=fmtHour(value);
  if(!v)return null;
  return(
    <span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,color,fontWeight:500}}>
      <SvgIcon type="time" color={color} size={11}/>
      {v}h
    </span>
  );
}

function ProjectLabel({project}){
  if(!project)return null;
  return(
    <span style={{fontSize:11,fontWeight:600,color:"#64748B"}}>
      {project}
    </span>
  );
}

function Pill({active,onClick,children}){
  return(
    <button onClick={onClick} style={{
      background:active?"#0070C0":"#DCE8F0",
      color:active?"#fff":"#64748B",
      border:"none",
      borderRadius:99,
      padding:"6px 14px",
      fontSize:12,
      fontWeight:700,
      cursor:"pointer",
      transition:"all .15s"
    }}>{children}</button>
  );
}

function SectionLabel({children}){
  return(
    <div style={{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:10,marginTop:4,textTransform:"uppercase",letterSpacing:.6}}>
      {children}
    </div>
  );
}

function Field({label,children}){
  return(
    <div style={{marginBottom:14}}>
      <label style={{fontSize:11,fontWeight:700,color:"#64748B",display:"block",marginBottom:5,textTransform:"uppercase",letterSpacing:.5}}>{label}</label>
      {children}
    </div>
  );
}

function OptionBtns({options,value,onChange,colored}){
  return(
    <div style={{display:"flex",gap:3}}>
      {options.map(opt=>{
        const val=typeof opt==="string"?opt:opt.value;
        const label=typeof opt==="string"?opt:opt.label;
        const active=value===val;
        const clr=colored&&active?(LVL_CLR[val]||"#0070C0"):(active?"#0070C0":"#94A3B8");
        const bg=colored&&active?(LVL_BG[val]||"#EFF6FF"):(active?"#EFF6FF":"#F8FAFC");
        return(
          <button key={val} type="button" onClick={()=>onChange(active?"":val)}
            style={{
              flex:1,padding:"7px 2px",
              fontSize:label.length>7?9.5:11,
              fontWeight:active?700:500,
              color:clr,background:bg,
              border:`1.5px solid ${active?clr:"#E2E8F0"}`,
              borderRadius:7,cursor:"pointer",
              textAlign:"center",lineHeight:1.3,
              wordBreak:"break-word",transition:"all .12s"
            }}>{label}</button>
        );
      })}
    </div>
  );
}

function Checkbox({checked,onClick,size}){
  const sz=size||20;
  return(
    <div onClick={e=>{e.stopPropagation();onClick?.();}} style={{
      width:sz,height:sz,minWidth:sz,borderRadius:sz>18?6:5,cursor:"pointer",flexShrink:0,
      border:checked?"none":"2px solid #CBD5E1",
      background:checked?"#0070C0":"transparent",
      display:"flex",alignItems:"center",justifyContent:"center",
      transition:"all .15s"
    }}>
      {checked&&(
        <svg width={sz*.6} height={sz*.6} viewBox="0 0 12 12" fill="none">
          <path d="M2.5 6L5 8.5L9.5 3.5" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
    </div>
  );
}

/* ═══ Card Layout ═══ */
function TodoCard({item,onClick,showCheck,checked,onCheck,dimmed}){
  const[hover,setHover]=useState(false);
  return(
    <div onClick={onClick} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{
      background:dimmed?"#F8FAFC":"#fff",
      border:`1px solid ${hover&&!dimmed?"#CBD5E1":"#E2E8F0"}`,
      borderRadius:12,
      padding:"12px 14px",
      cursor:"pointer",
      display:"flex",
      alignItems:"flex-start",
      gap:11,
      opacity:dimmed?.58:1,
      transition:"border-color .15s,opacity .2s"
    }}>
      {showCheck&&<div style={{marginTop:2}}><Checkbox checked={checked} onClick={onCheck}/></div>}
      <div style={{flex:1,minWidth:0}}>
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,marginBottom:7}}>
          <div style={{
            fontSize:14,
            fontWeight:600,
            color:"#1E293B",
            minWidth:0,
            flex:1,
            textDecoration:dimmed?"line-through":"none",
            textDecorationColor:"#94A3B8"
          }}>
            {item.taskName
              ?(
                <>
                  <span style={{color:"#1E293B",fontWeight:600}}>{item.taskName}</span>
                  <span style={{color:"#ccc",margin:"0 7px",fontWeight:400}}>|</span>
                  <span>{item.name}</span>
                </>
              )
              :item.displayName}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
            <Badge level={item.importance} type="i"/>
            <Badge level={item.urgency} type="u"/>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <TimeLabel value={item.requiredTime}/>
          <ProjectLabel project={item.project}/>
          {item.deadline&&<span style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,color:"#64748B"}}><SvgIcon type="deadline" color="#64748B" size={11}/>{fmtDate(item.deadline)}</span>}
        </div>
      </div>
    </div>
  );
}

function AllTaskCard({task,onEdit,onToggleSub,onSetTimeToDo}){
  const[expanded,setExpanded]=useState(false);
  const eff=effective(task);
  const done=taskIsComplete(task);
  const hasSubs=task.subtasks&&task.subtasks.length>0;

  return(
    <div style={{borderRadius:12,border:"1px solid #E2E8F0",overflow:"hidden"}}>
      <div onClick={()=>onEdit(task)} style={{
        background:done?"#F8FAFC":"#fff",
        padding:"11px 14px",
        cursor:"pointer",
        opacity:done?.58:1,
        borderBottom:expanded&&hasSubs?"1px solid #DCE8F0":"none"
      }}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{
            flex:1,minWidth:0,fontSize:14,fontWeight:600,color:"#1E293B",
            textDecoration:done?"line-through":"none",textDecorationColor:"#94A3B8",
            display:"flex",alignItems:"center",gap:6
          }}>
            <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.name}</span>
            {hasSubs&&(
              <button onClick={e=>{e.stopPropagation();setExpanded(x=>!x);}} style={{
                background:"none",border:"none",cursor:"pointer",fontSize:18,
                color:"#94A3B8",padding:"0 2px",lineHeight:1,flexShrink:0,
                transform:expanded?"rotate(90deg)":"rotate(0deg)",transition:"transform .2s"
              }}>›</button>
            )}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center",flexShrink:0}}>
            <Badge level={eff.importance} type="i"/>
            <Badge level={eff.urgency} type="u"/>
          </div>
        </div>
      </div>

      {expanded&&hasSubs&&(
        <div style={{background:"#F8FAFC",padding:"4px 10px 6px"}}>
          {task.subtasks.map(s=>{
            const sDone=!!s.completedDate;
            const ttd=s.timeToDo||"";
            return(
              <div key={s.id} style={{
                display:"flex",alignItems:"center",gap:8,
                padding:"6px 8px",borderRadius:8,marginBottom:2,
                opacity:sDone?.45:1,transition:"opacity .15s"
              }}>
                {/* Done checkbox */}
                <Checkbox checked={sDone} onClick={()=>onToggleSub(task.id,s.id)} size={16}/>

                {/* Name + time */}
                <span style={{
                  flex:1,minWidth:0,fontSize:13,color:"#1E293B",fontWeight:500,
                  textDecoration:sDone?"line-through":"none",textDecorationColor:"#94A3B8",
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"
                }}>{s.name}</span>
                {s.requiredTime&&<TimeLabel value={s.requiredTime} color="#94A3B8"/>}

                {/* TimeToDo single-select checkboxes */}
                <div style={{display:"flex",gap:1,alignItems:"center",flexShrink:0}}
                  onClick={e=>e.stopPropagation()}>
                  {[["today","T"],["this week","W"],["this month","M"]].map(([period,lbl])=>{
                    const on=ttd===period;
                    return(
                      <button key={period}
                        onClick={()=>!sDone&&onSetTimeToDo(task.id,s.id,on?"":period)}
                        title={period}
                        style={{
                          display:"flex",flexDirection:"column",alignItems:"center",gap:2,
                          background:"none",border:"none",cursor:sDone?"default":"pointer",
                          padding:"2px 4px",borderRadius:5
                        }}>
                        <div style={{
                          width:13,height:13,borderRadius:3,flexShrink:0,
                          border:`1.5px solid ${on?"#0070C0":"#CBD5E1"}`,
                          background:on?"#0070C0":"transparent",
                          display:"flex",alignItems:"center",justifyContent:"center",

/* ═══ Matrix ═══ */
function MatrixView({tasks}){
  const grouped={};

  tasks.forEach(t=>{
    const e=effective(t);
    const x=LVL_VAL[e.importance]??0;
    const y=LVL_VAL[e.urgency]??0;
    const key=`${x},${y}`;
    if(!grouped[key])grouped[key]=[];
    grouped[key].push({task:t,e,x,y});
  });

  const points=[];
  Object.values(grouped).forEach(group=>{
    group.forEach((p,i)=>{
      const center=(group.length-1)/2;
      const labelOffset=(i-center)*20;
      points.push({...p,labelOffset});
    });
  });

  const AxisLabel=({children,style})=>(
    <div style={{
      position:"absolute",
      fontSize:11,
      color:"#64748B",
      fontWeight:700,
      letterSpacing:.2,
      ...style
    }}>
      {children}
    </div>
  );

  return(
    <div style={{background:"#fff",border:"1px solid #E2E8F0",borderRadius:14,padding:14}}>
      <div style={{
        position:"relative",
        height:360,
        border:"1px solid #D1D9E6",
        borderRadius:12,
        background:"#FFFFFF",
        overflow:"hidden"
      }}>
        <div style={{
          position:"absolute",
          left:"50%",
          top:0,
          bottom:0,
          width:1,
          background:"#CBD5E1"
        }}/>
        <div style={{
          position:"absolute",
          top:"50%",
          left:0,
          right:0,
          height:1,
          background:"#CBD5E1"
        }}/>

        <AxisLabel style={{left:"calc(50% + 8px)",top:8}}>
          urgency <span style={{fontWeight:700}}>↑</span>
        </AxisLabel>

        <AxisLabel style={{right:10,top:"calc(50% + 8px)"}}>
          importance <span style={{fontWeight:700}}>→</span>
        </AxisLabel>

        {points.map((p,i)=>{
          const left=50+(p.x/2)*42;
          const top=50-(p.y/2)*42;

          return(
            <div key={p.task.id} style={{
              position:"absolute",
              left:`${left}%`,
              top:`${top}%`,
              transform:"translate(-7px,-7px)",
              display:"flex",
              alignItems:"center",
              gap:5,
              zIndex:10+i
            }}>
              <span style={{
                width:14,
                height:14,
                borderRadius:"50%",
                background:"#0070C0",
                border:"2px solid #fff",
                boxShadow:"0 1px 4px rgba(0,0,0,.18)",
                flexShrink:0
              }}/>
              <span style={{
                fontSize:11,
                fontWeight:600,
                color:"#475569",
                background:"rgba(255,255,255,.9)",
                padding:"1px 5px",
                borderRadius:6,
                whiteSpace:"nowrap",
                boxShadow:"0 1px 3px rgba(0,0,0,.06)",
                transform:`translateY(${p.labelOffset}px)`,
                display:"inline-block"
              }}>
                {p.task.name}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ═══ Edit Todo Modal ═══ */
function EditTodoModal({open,onClose,period,tasks,todoLists,todoOrder,onUpdate}){
  const[lists,setLists]=useState({});
  const[orders,setOrders]=useState({});
  const[addTab,setAddTab]=useState("");
  const[dragIdx,setDragIdx]=useState(null);
  const[dragOver,setDragOver]=useState(null);

  useEffect(()=>{
    setLists({
      today:[...(todoLists.today||[])],
      "this week":[...(todoLists["this week"]||[])],
      "this month":[...(todoLists["this month"]||[])]
    });
    setOrders({
      today:[...(todoOrder.today||[])],
      "this week":[...(todoOrder["this week"]||[])],
      "this month":[...(todoOrder["this month"]||[])]
    });
    // default tab for each period
    setAddTab(period==="today"?"week":period==="this week"?"month":"");
  },[open]);

  const allItems=useMemo(()=>buildTodoItems(tasks),[tasks]);
  const currentRefs=lists[period]||[];

  // All available: not in list AND not completed
  const allAvailable=allItems.filter(it=>!currentRefs.includes(it.ref)&&!it.completedDate);

  // Tabs config per period
  const tabsConfig={
    "today":[
      {key:"week",    label:"this week",   filter:it=>it.timeToDo==="this week"},
      {key:"month",   label:"this month",  filter:it=>it.timeToDo==="this month"},
      {key:"others",  label:"others",      filter:it=>it.timeToDo!=="this week"&&it.timeToDo!=="this month"}
    ],
    "this week":[
      {key:"month",   label:"this month",  filter:it=>it.timeToDo==="this month"},
      {key:"others",  label:"others",      filter:it=>it.timeToDo!=="this month"}
    ],
    "this month":null
  };
  const tabs=tabsConfig[period];
  const activeTabFilter=tabs?tabs.find(t=>t.key===addTab)?.filter:null;
  const available=activeTabFilter?allAvailable.filter(activeTabFilter):allAvailable;

  const addItem=ref=>{
    const nl={...lists},no={...orders};
    const push=(r,p)=>{
      if(!(nl[p]||[]).includes(r)){
        nl[p]=[...(nl[p]||[]),r];
        no[p]=[...(no[p]||[]),r];
      }
    };
    if(period==="today")["today","this week","this month"].forEach(p=>push(ref,p));
    else if(period==="this week")["this week","this month"].forEach(p=>push(ref,p));
    else push(ref,"this month");
    setLists(nl);
    setOrders(no);
  };

  const removeItem=ref=>{
    const nl={...lists},no={...orders};
    const rm=(r,p)=>{
      nl[p]=(nl[p]||[]).filter(i=>i!==r);
      no[p]=(no[p]||[]).filter(i=>i!==r);
    };
    if(period==="this month")["today","this week","this month"].forEach(p=>rm(ref,p));
    else if(period==="this week")["today","this week"].forEach(p=>rm(ref,p));
    else rm(ref,"today");
    setLists(nl);
    setOrders(no);
  };

  const moveItem=(from,to)=>{
    const arr=[...(orders[period]||[])];
    const[item]=arr.splice(from,1);
    arr.splice(to,0,item);
    setOrders({...orders,[period]:arr});
  };

  const orderedRefs=useMemo(()=>{
    const o=(orders[period]||[]).filter(r=>currentRefs.includes(r));
    currentRefs.forEach(r=>{if(!o.includes(r))o.push(r)});
    return o;
  },[orders,currentRefs,period]);

  // Only show non-completed items in the list (completed ones hide automatically)
  const displayRefs=orderedRefs.filter(ref=>{
    const it=allItems.find(x=>x.ref===ref);
    return !it||!it.completedDate;
  });

  const findItem=ref=>allItems.find(it=>it.ref===ref);

  return(
    <Modal open={open} onClose={onClose} title={`Edit — ${period}`} width={500}>
      <div style={{marginBottom:0}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <span style={{fontSize:13,fontWeight:600,color:"#64748B"}}>Tasks ({displayRefs.length})</span>
          <div style={{display:"flex",gap:8}}>
            <button style={{...btnS,padding:"5px 14px",fontSize:12}} onClick={onClose}>Cancel</button>
            <button style={{...btnP,padding:"5px 14px",fontSize:12}} onClick={()=>{onUpdate(lists,orders);onClose();}}>Save</button>
          </div>
        </div>

        <div style={{border:"1px solid #E2E8F0",borderRadius:10,marginBottom:12,background:"#FFFFFF",overflow:"hidden"}}>
          {/* Tabs for today / this week periods */}
          {tabs&&(
            <div style={{display:"flex",borderBottom:"1px solid #E2E8F0",background:"#DCE8F0"}}>
              {tabs.map(t=>(
                <button key={t.key} onClick={()=>setAddTab(t.key)} style={{
                  flex:1,padding:"7px 4px",fontSize:11,fontWeight:addTab===t.key?700:500,
                  color:addTab===t.key?"#1E293B":"#64748B",
                  background:addTab===t.key?"#fff":"transparent",
                  border:"none",borderBottom:addTab===t.key?"2px solid #0070C0":"2px solid transparent",
                  cursor:"pointer",whiteSpace:"nowrap"
                }}>{t.label}<span style={{marginLeft:4,fontWeight:400,color:"#94A3B8",fontSize:10}}>
                  {allAvailable.filter(t.filter).length}
                </span></button>
              ))}
            </div>
          )}
          <div style={{padding:10,maxHeight:200,overflow:"auto"}}>
            {available.length===0
              ?<div style={{fontSize:13,color:"#94A3B8",textAlign:"center",padding:"12px 0"}}>No tasks to add</div>
              :available.map(it=>(
                <div key={it.ref} onClick={()=>addItem(it.ref)} style={{padding:"8px 10px",borderRadius:8,cursor:"pointer",fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#DCE8F0"}
                  onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <span style={{color:"#1E293B"}}>{it.displayName}</span>
                  <span style={{fontSize:11,color:"#64748B"}}>{it.project||""}</span>
                </div>
              ))}
          </div>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {displayRefs.map((ref,idx)=>{
            const it=findItem(ref);
            return(
              <div key={ref} draggable
                onDragStart={()=>setDragIdx(idx)}
                onDragOver={e=>{e.preventDefault();setDragOver(idx);}}
                onDrop={()=>{if(dragIdx!=null&&dragIdx!==idx)moveItem(dragIdx,idx);setDragIdx(null);setDragOver(null);}}
                onDragEnd={()=>{setDragIdx(null);setDragOver(null);}}
                style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:dragOver===idx?"#EFF6FF":"#fff",border:"1px solid #E2E8F0",borderRadius:10,cursor:"grab"}}>
                <span style={{color:"#CBD5E1",fontSize:15,userSelect:"none"}}>⠿</span>
                <span style={{flex:1,fontSize:13,fontWeight:500,color:"#1E293B",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{it?it.displayName:ref}</span>
                {it&&it.project&&<span style={{fontSize:11,color:"#64748B",flexShrink:0}}>{it.project}</span>}
                <button onClick={()=>removeItem(ref)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,color:"#CBD5E1",padding:2,flexShrink:0}}>✕</button>
              </div>
            );
          })}
        </div>
      </div>
    </Modal>
  );
}

          <button style={{...btnP,marginTop:12,opacity:text.trim()?1:.4}} disabled={!text.trim()} onClick={()=>{

          }}>Import</button>
        </>
      )}
    </Modal>
  );
}

/* ═══════════ MAIN APP ═══════════ */
function App(){
  const[data,setData]=useState(()=>load()||defState());
  const[mainTab,setMainTab]=useState("todo");
  const[allSub,setAllSub]=useState("active");
  const[todoSub,setTodoSub]=useState("today");
  const[sortBy,setSortBy]=useState("importance");
  const[showMatrix,setShowMatrix]=useState(false);
  const[compView,setCompView]=useState("week");
  const[showForm,setShowForm]=useState(false);
  const[editTask,setEditTask]=useState(null);
  const[showImport,setShowImport]=useState(false);
  const[showEditTodo,setShowEditTodo]=useState(false);

  /* ── Cloud sync state ── */
  const[syncStatus,setSyncStatus]=useState('init'); // 'init'|'syncing'|'ok'|'err'
  const syncSkip=useRef(1);  // skip the first useEffect trigger (initial render)
  const syncTimer=useRef(null);

  /* ① Save to localStorage on every change (original behavior, unchanged) */
  useEffect(()=>{save(data)},[data]);

  /* ② Debounced push to Supabase on every data change */
  useEffect(()=>{
    if(syncSkip.current>0){syncSkip.current--;return;}
    setSyncStatus('syncing');
    clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(async()=>{
      try{
        const snap={...data,_ts:new Date().toISOString()};
        save(snap);
        await sb.from('todo_state').upsert({id:'singleton',data:snap,updated_at:new Date().toISOString()});
        setSyncStatus('ok');
      }catch(e){
        console.error('Sync error:',e);
        setSyncStatus('err');
      }
    },2000);
  },[data]);

  /* ③ On first load: pull from Supabase if cloud is newer than localStorage */
  useEffect(()=>{
    (async()=>{
      try{
        const{data:row,error}=await sb.from('todo_state')
          .select('data,updated_at').eq('id','singleton').maybeSingle();
        if(!error&&row){
          const local=load();
          const localTs=local?._ts?new Date(local._ts):new Date(0);
          const cloudTs=new Date(row.updated_at);
          if(cloudTs>localTs){
            syncSkip.current++; // don't re-push the data we just pulled
            save(row.data);
            setData(row.data);
            setSyncStatus('ok');
            return;
          }
        }
        setSyncStatus('ok');
      }catch(e){
        console.error('Cloud load error:',e);
        setSyncStatus('err');
      }
    })();
  },[]);

  /* ④ Manual sync: always pull latest from cloud */
  const manualSync=async()=>{
    if(syncStatus==='syncing')return;
    setSyncStatus('syncing');
    try{
      const{data:row,error}=await sb.from('todo_state')
        .select('data,updated_at').eq('id','singleton').maybeSingle();
      if(!error&&row){
        syncSkip.current++;
        save(row.data);
        setData(row.data);
      }
      setSyncStatus('ok');
    }catch(e){
      console.error('Manual sync error:',e);
      setSyncStatus('err');
    }
  };
  const update=fn=>setData(d=>({...d,...fn(d)}));

  const syncRefs=(oldTask,newTask,lists,orders)=>{
    const nl={...lists},no={...orders};
    const rm=ref=>["today","this week","this month"].forEach(p=>{
      nl[p]=(nl[p]||[]).filter(r=>r!==ref);
      no[p]=(no[p]||[]).filter(r=>r!==ref);
    });
    const add=(ref,ttd)=>{
      const push=(r,p)=>{
        if(!(nl[p]||[]).includes(r)){
          nl[p]=[...(nl[p]||[]),r];
          no[p]=[...(no[p]||[]),r];
        }
      };
      if(ttd==="today")["today","this week","this month"].forEach(p=>push(ref,p));
      else if(ttd==="this week")["this week","this month"].forEach(p=>push(ref,p));
      else if(ttd==="this month")push(ref,"this month");
    };

    if(oldTask){
      if(oldTask.subtasks&&oldTask.subtasks.length>0)oldTask.subtasks.forEach(s=>rm(mkRef(oldTask.id,s.id)));
      else rm(oldTask.id);
    }

    if(newTask.subtasks&&newTask.subtasks.length>0){
      newTask.subtasks.forEach(s=>{
        if(!s.completedDate)add(mkRef(newTask.id,s.id),s.timeToDo||"");
      });
    }else{
      if(!newTask.completedDate)add(newTask.id,newTask.timeToDo||"");
    }

    return{todoLists:nl,todoOrder:no};
  };

  const saveTask=form=>{
    update(d=>{
      const tasks=[...d.tasks];
      let lists={
        today:[...(d.todoLists.today||[])],
        "this week":[...(d.todoLists["this week"]||[])],
        "this month":[...(d.todoLists["this month"]||[])]
      };
      let orders={
        today:[...(d.todoOrder.today||[])],
        "this week":[...(d.todoOrder["this week"]||[])],
        "this month":[...(d.todoOrder["this month"]||[])]
      };
      let oldTask=null;

      if(form.id){
        const idx=tasks.findIndex(t=>t.id===form.id);
        if(idx>=0){
          oldTask={...tasks[idx],subtasks:tasks[idx].subtasks?tasks[idx].subtasks.map(s=>({...s})):[]};
          let cd=form.completedDate;
          if(form.subtasks&&form.subtasks.length>0){
            const allDone=form.subtasks.every(s=>!!s.completedDate);
            cd=allDone?(cd||nowLocalISO()):null;
          }
          tasks[idx]={...form,completedDate:cd};
        }
      }else{
        const id=uid();
        form={...form,id,completedDate:null};
        tasks.push(form);
      }

      const nt=tasks.find(t=>t.id===form.id);
      const s=syncRefs(oldTask,nt,lists,orders);
      return{tasks,...s};
    });

    setShowForm(false);
    setEditTask(null);
  };

  const deleteTask=id=>{
    update(d=>{
      const t=d.tasks.find(x=>x.id===id);
      const nl={...d.todoLists},no={...d.todoOrder};
      const rm=ref=>["today","this week","this month"].forEach(p=>{
        nl[p]=(nl[p]||[]).filter(r=>r!==ref);
        no[p]=(no[p]||[]).filter(r=>r!==ref);
      });

      if(t){
        if(t.subtasks&&t.subtasks.length>0)t.subtasks.forEach(s=>rm(mkRef(id,s.id)));
        else rm(id);
      }

      return{tasks:d.tasks.filter(x=>x.id!==id),todoLists:nl,todoOrder:no};
    });

    setShowForm(false);
    setEditTask(null);
  };

  const toggleRef=ref=>{
    const{taskId,subtaskId}=parseRef(ref);
    update(d=>({tasks:d.tasks.map(t=>{
      if(t.id!==taskId)return t;
      if(subtaskId){
        const subs=(t.subtasks||[]).map(s=>s.id===subtaskId
          ?(s.completedDate?{...s,completedDate:null}:{...s,completedDate:nowLocalISO()})
          :s
        );
        const allDone=subs.every(s=>!!s.completedDate);
        return{...t,subtasks:subs,completedDate:allDone?nowLocalISO():null};
      }
      return t.completedDate?{...t,completedDate:null}:{...t,completedDate:nowLocalISO()};
    })}));
  };

  const toggleSubAll=(taskId,subId)=>{
    update(d=>({tasks:d.tasks.map(t=>{
      if(t.id!==taskId)return t;
      const subs=(t.subtasks||[]).map(s=>s.id===subId
        ?(s.completedDate?{...s,completedDate:null}:{...s,completedDate:nowLocalISO()})
        :s
      );
      const allDone=subs.every(s=>!!s.completedDate);
      return{...t,subtasks:subs,completedDate:allDone?nowLocalISO():null};
    })}));
  };

  const updateSubTimeToDo=(taskId,subId,newTtd)=>{
    update(d=>{
      const tasks=[...d.tasks];
      const idx=tasks.findIndex(t=>t.id===taskId);
      if(idx<0)return d;
      const oldTask=tasks[idx];
      const newTask={...oldTask,subtasks:oldTask.subtasks.map(s=>s.id===subId?{...s,timeToDo:newTtd}:s)};
      tasks[idx]=newTask;
      const lists={
        today:[...(d.todoLists.today||[])],
        "this week":[...(d.todoLists["this week"]||[])],
        "this month":[...(d.todoLists["this month"]||[])]
      };
      const orders={
        today:[...(d.todoOrder.today||[])],
        "this week":[...(d.todoOrder["this week"]||[])],
        "this month":[...(d.todoOrder["this month"]||[])]
      };
      const{todoLists,todoOrder}=syncRefs(oldTask,newTask,lists,orders);
      return{...d,tasks,todoLists,todoOrder};
    });
  };

  const getTodoItems=period=>{
    const{tasks,todoLists,todoOrder}=data;
    const ids=todoLists[period]||[];
    const ord=todoOrder[period]||[];
    let ordered;

    if(period==="this week"){
      const t=(todoOrder["today"]||[]).filter(r=>ids.includes(r));
      ordered=[...t,...ord.filter(r=>!t.includes(r)&&ids.includes(r))];
    }else if(period==="this month"){
      const w=(todoOrder["this week"]||[]).filter(r=>ids.includes(r));
      const t=(todoOrder["today"]||[]).filter(r=>w.includes(r));
      const wOnly=w.filter(r=>!t.includes(r));
      ordered=[...t,...wOnly,...ord.filter(r=>!w.includes(r)&&ids.includes(r))];
    }else{
      ordered=ord.filter(r=>ids.includes(r));
    }

    ids.forEach(r=>{if(!ordered.includes(r))ordered.push(r)});
    const all=buildTodoItems(tasks);
    return ordered.map(ref=>{
      const it=all.find(x=>x.ref===ref);
      return it?{...it,_ref:ref}:null;
    }).filter(Boolean);
  };

  const{tasks,todoLists,todoOrder}=data;
  const activeTasks=tasks.filter(t=>!taskIsComplete(t));
  const completedTasks=tasks.filter(t=>taskIsComplete(t));

  return(
    <div style={{maxWidth:640,margin:"0 auto",minHeight:"100vh",background:"#FFFFFF",position:"relative",paddingBottom:80}}>
      <div style={{padding:"18px 20px 0",display:"flex",borderBottom:"1px solid #E2E8F0",position:"sticky",top:0,background:"#FFFFFF",zIndex:50,alignItems:"flex-end"}}>
        <div style={{display:"flex",flex:1}}>
        {[["todo","To do"],["all","All tasks"]].map(([tab,label])=>(
          <button key={tab} onClick={()=>setMainTab(tab)} style={{
            background:"none",
            border:"none",
            borderBottom:mainTab===tab?"2.5px solid #0070C0":"2.5px solid transparent",
            padding:"7px 20px 11px",
            fontSize:15,
            fontWeight:mainTab===tab?700:500,
            color:mainTab===tab?"#1E293B":"#94A3B8",
            cursor:"pointer"
          }}>{label}</button>
        ))}
        </div>
        {/* Sync button */}
        <button onClick={manualSync} disabled={syncStatus==='syncing'}
          title={syncStatus==='ok'?'已同步，点击手动同步':syncStatus==='syncing'?'同步中…':syncStatus==='err'?'同步失败，点击重试':'点击同步'}
          style={{
            marginBottom:10,marginRight:2,
            display:"flex",alignItems:"center",gap:3,
            fontSize:11,fontWeight:600,
            color:syncStatus==='ok'?'#4f9460':syncStatus==='err'?'#d94f3d':'#c49a2a',
            background:"none",border:"none",
            cursor:syncStatus==='syncing'?'default':'pointer',
            padding:"2px 6px",borderRadius:6,
            opacity:syncStatus==='syncing'?0.7:1,
            transition:"color .3s"
          }}>
          <span style={{
            fontSize:14,display:"inline-block",lineHeight:1,
            animation:syncStatus==='syncing'?'spin .8s linear infinite':'none'
          }}>↻</span>
          <span>{syncStatus==='syncing'?'syncing…':syncStatus==='err'?'error':'synced'}</span>
        </button>
        {/* Import / Export icon */}
        <button onClick={()=>setShowImport(true)} title="Import / Export"
          style={{marginBottom:10,marginRight:6,background:"none",border:"none",cursor:"pointer",padding:"2px 4px",display:"flex",alignItems:"center",color:"#94A3B8"}}>
          <SvgIcon type="export" color="#94A3B8" size={15}/>
        </button>
      </div>

      {/* ═══ TO DO ═══ */}
      {mainTab==="todo"&&(
        <div>
          <div style={{padding:"12px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",gap:6}}>
              {TTD.map(t=><Pill key={t} active={todoSub===t} onClick={()=>setTodoSub(t)}>{t}</Pill>)}
            </div>
            <button onClick={()=>setShowEditTodo(true)} style={{background:"none",border:"1px solid #D1D9E6",borderRadius:8,padding:"5px 14px",fontSize:12,fontWeight:600,color:"#64748B",cursor:"pointer"}}>
              Edit
            </button>
          </div>

          <div style={{padding:"14px 20px"}}>
            {(()=>{
              const items=getTodoItems(todoSub);
              const pending=items.filter(it=>!it.completedDate);
              const done=items.filter(it=>it.completedDate&&isInPeriod(it.completedDate,todoSub));

              if(!pending.length&&!done.length)return(
                <div style={{textAlign:"center",padding:"52px 20px",color:"#94A3B8"}}>
                  <div style={{fontSize:36,marginBottom:10}}>✨</div>
                  <div style={{fontSize:14,fontWeight:500}}>No tasks for {todoSub}</div>
                  <div style={{fontSize:12,marginTop:4}}>Click Edit to add tasks</div>
                </div>
              );

              return(
                <>
                  {pending.length>0&&(
                    <div style={{marginBottom:22}}>
                      <SectionLabel>Pending</SectionLabel>
                      <div style={{display:"flex",flexDirection:"column",gap:8}}>
                        {pending.map(it=>(
                          <TodoCard key={it._ref} item={it} showCheck checked={false}
                            onCheck={()=>toggleRef(it._ref)}
                            onClick={()=>{const t=tasks.find(x=>x.id===it.taskId);if(t){setEditTask(t);setShowForm(true);}}}/>
                        ))}
                      </div>
                    </div>
                  )}

                  {done.length>0&&(
                    <div>
                      <SectionLabel>Completed</SectionLabel>
                      <div style={{display:"flex",flexDirection:"column",gap:8}}>
                        {done.map(it=>(
                          <TodoCard key={it._ref} item={it} showCheck checked dimmed
                            onCheck={()=>toggleRef(it._ref)}
                            onClick={()=>{const t=tasks.find(x=>x.id===it.taskId);if(t){setEditTask(t);setShowForm(true);}}}/>
                        ))}
                      </div>
                    </div>
                  )}
                </>
              );
            })()}
          </div>
        </div>
      )}

      {/* ═══ ALL TASKS ═══ */}
      {mainTab==="all"&&(
        <div>
          <div style={{padding:"12px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
            <div style={{display:"flex",gap:6,flexShrink:0}}>
              <Pill active={allSub==="active"} onClick={()=>setAllSub("active")}>Active</Pill>
              <Pill active={allSub==="completed"} onClick={()=>setAllSub("completed")}>Completed</Pill>
            </div>

            {allSub==="active"&&(
              <div style={{display:"flex",gap:2,alignItems:"center"}}>
                {["importance","project"].map(s=>(
                  <button key={s} onClick={()=>{setSortBy(s);setShowMatrix(false);}} style={{
                    background:"none",border:"none",
                    padding:"4px 7px",fontSize:11,cursor:"pointer",
                    fontWeight:sortBy===s&&!showMatrix?700:400,
                    color:sortBy===s&&!showMatrix?"#0070C0":"#94A3B8"
                  }}>{s}</button>
                ))}
                <button onClick={()=>setShowMatrix(v=>!v)} style={{
                  background:"none",border:"none",
                  padding:"4px 7px",fontSize:11,cursor:"pointer",
                  fontWeight:showMatrix?700:400,
                  color:showMatrix?"#0070C0":"#94A3B8"
                }}>Matrix</button>
              </div>
            )}

            {allSub==="completed"&&(
              <div style={{display:"flex",gap:2,alignItems:"center"}}>
                {["week","month"].map(v=>(
                  <button key={v} onClick={()=>setCompView(v)} style={{
                    background:"none",border:"none",
                    padding:"4px 7px",fontSize:11,cursor:"pointer",
                    fontWeight:compView===v?700:400,
                    color:compView===v?"#0070C0":"#94A3B8"
                  }}>By {v}</button>
                ))}
              </div>
            )}
          </div>

          <div style={{padding:"14px 20px"}}>
            {allSub==="active"&&(
              <>
                {activeTasks.length===0
                  ?(
                    <div style={{textAlign:"center",padding:"52px 20px",color:"#94A3B8"}}>
                      <div style={{fontSize:36,marginBottom:10}}>📋</div>
                      <div style={{fontSize:14,fontWeight:500}}>No active tasks</div>
                    </div>
                  )
                  :showMatrix
                    ?<MatrixView tasks={activeTasks}/>
                    :sortBy==="project"
                      ?(
                        ()=>{
                          const grouped={};
                          sortTasks(activeTasks,"project").forEach(t=>{
                            const k=effective(t).project||"No Project";
                            if(!grouped[k])grouped[k]=[];
                            grouped[k].push(t);
                          });
                          return Object.entries(grouped).map(([project,items])=>(
                            <div key={project} style={{marginBottom:22}}>
                              <SectionLabel>{project}</SectionLabel>
                              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                                {items.map(t=>(
                                  <AllTaskCard key={t.id} task={t} onEdit={t=>{setEditTask(t);setShowForm(true);}} onToggleSub={toggleSubAll} onSetTimeToDo={updateSubTimeToDo}/>
                                ))}
                              </div>
                            </div>
                          ));
                        }
                      )()
                      :(
                        <div style={{display:"flex",flexDirection:"column",gap:8}}>
                          {sortTasks(activeTasks,sortBy).map(t=>(
                            <AllTaskCard key={t.id} task={t} onEdit={t=>{setEditTask(t);setShowForm(true);}} onToggleSub={toggleSubAll} onSetTimeToDo={updateSubTimeToDo}/>
                          ))}
                        </div>
                      )
                }
              </>
            )}

            {allSub==="completed"&&(
              <>
                {completedTasks.length===0
                  ?(
                    <div style={{textAlign:"center",padding:"52px 20px",color:"#94A3B8"}}>
                      <div style={{fontSize:36,marginBottom:10}}>🎉</div>
                      <div style={{fontSize:14,fontWeight:500}}>No completed tasks yet</div>
                    </div>
                  )
                  :groupCompleted(completedTasks,compView).map(([key,items])=>(
                    <div key={key} style={{marginBottom:22}}>
                      <SectionLabel>{fmtGroupLabel(key,compView)}</SectionLabel>
                      <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:10}}>
                        {items.map(t=>(
                          <AllTaskCard key={t.id} task={t} onEdit={t=>{setEditTask(t);setShowForm(true);}} onToggleSub={toggleSubAll} onSetTimeToDo={updateSubTimeToDo}/>
                        ))}
                      </div>
                    </div>
                  ))
                }
              </>
            )}
          </div>
        </div>
      )}

      {/* FAB */}
      <button onClick={()=>{setEditTask(null);setShowForm(true);}} style={{
        position:"fixed",
        bottom:24,
        right:"max(24px,calc(50% - 296px))",
        width:52,
        height:52,
        borderRadius:16,
        background:"#0070C0",
        color:"#fff",
        border:"none",
        fontSize:28,
        cursor:"pointer",
        lineHeight:1,
        boxShadow:"0 4px 20px rgba(37,99,235,.35)",
        display:"flex",
        alignItems:"center",
        justifyContent:"center",
        zIndex:100
      }}>+</button>

      <Modal open={showForm} onClose={()=>{setShowForm(false);setEditTask(null);}} title={editTask?"Edit Task":"New Task"} width={480}>
        <TaskForm task={editTask} onSave={saveTask} onDelete={deleteTask} onClose={()=>{setShowForm(false);setEditTask(null);}}/>
      </Modal>

      <EditTodoModal open={showEditTodo} onClose={()=>setShowEditTodo(false)}
        period={todoSub}
        tasks={tasks}
        todoLists={todoLists}
        todoOrder={todoOrder}
        onUpdate={(l,o)=>update(()=>({todoLists:l,todoOrder:o}))}/>

      <ImportExportModal open={showImport} onClose={()=>setShowImport(false)} data={data} onImport={d=>setData(d)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
